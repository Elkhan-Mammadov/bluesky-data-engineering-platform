# dbt project definition.
name: 'bluesky_activity'
version: '1.0.0'
config-version: 2

profile: 'bluesky_activity'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# generate_schema_name (macros/generate_schema_name.sql) makes each layer
# land in exactly the schema named below - no target-schema prefix.
models:
  bluesky_activity:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      fct_interactions:
        +materialized: incremental
        +unique_key: ['user_id_hash', 'record_key', 'interaction_type']

snapshots:
  bluesky_activity:
    +schema: snapshots
