# Grafana dashboard provisioning - loads bluesky_dashboard.json
# automatically from the mounted directory, no manual UI import needed.
apiVersion: 1

providers:
  - name: 'bluesky-dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
