# dbt connection profile for the warehouse database.
# Values come ONLY from environment variables - never hardcode credentials
# here. This file is safe to commit.
bluesky_activity:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_DB_HOST') }}"
      port: "{{ env_var('WAREHOUSE_DB_PORT') | as_number }}"
      user: "{{ env_var('WAREHOUSE_DB_USER') }}"
      password: "{{ env_var('WAREHOUSE_DB_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB_NAME') }}"
      schema: staging
      threads: 4
